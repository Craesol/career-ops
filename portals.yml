    # simplemente en "France" no puede morir en el escaner. El split
    # scan-vs-evaluacion se mantiene: un "on-site" explicito sigue bloqueado
    # por la lista block, y la politica de la zona de Niza se aplica en la
    # evaluacion, donde se puede leer la cadencia real de oficina.

search_queries:
  - name: Ashby — Community (Web3)
    query: >-
      site:jobs.ashbyhq.com ("Community Manager" OR "Community Lead" OR "Head of Community") (web3
      OR crypto OR blockchain)
    enabled: true
  - name: Lever — Community (Web3)
    query: >-
      site:jobs.lever.co ("Community Manager" OR "Community Lead" OR "Head of Community") (web3 OR
      crypto OR blockchain)
    enabled: true
  - name: Greenhouse — Community (Web3)
    query: >-
      site:job-boards.greenhouse.io ("Community Manager" OR "Head of Community") (web3 OR crypto OR
      gaming)
    enabled: true
  - name: Greenhouse — Social & Content
    query: >-
      site:job-boards.greenhouse.io ("Social Media Manager" OR "Content Manager" OR "Marketing
      Communications") remote
    enabled: false
  - name: Community Growth & Building (cross-ATS)
    query: >-
      ("community growth" OR "community builder" OR "head of community growth" OR "community-led
      growth") remote (site:jobs.ashbyhq.com OR site:job-boards.greenhouse.io OR site:jobs.lever.co)
    enabled: true
  - name: Community Building — Web3/Gaming
    query: >-
      ("community building" OR "community builder" OR "grow the community") (web3 OR gaming OR
      crypto) remote Europe
    enabled: true
  - name: Ashby — Ecosystem & Growth
    query: >-
      site:jobs.ashbyhq.com ("Ecosystem Lead" OR "Ecosystem Manager" OR "Growth Lead") (crypto OR
      web3)
    enabled: true
  - name: CryptocurrencyJobs — Community
    query: site:cryptocurrencyjobs.co ("community manager" OR "head of community" OR "social media")
    enabled: true
  - name: Web3.career — Community
    query: site:web3.career ("community manager" OR "community lead" OR "social media manager")
    enabled: true
  - name: CryptoJobsList — Community
    query: site:cryptojobslist.com ("community manager" OR "head of community")
    enabled: true
  - name: RemoteOK — Community
    query: site:remoteok.com ("community manager" OR "social media manager") remote
    enabled: true
  - name: Gaming — Community EMEA
    query: ("community manager" OR "player experience") gaming remote (EMEA OR Europe OR France)
    enabled: true
  - name: Esports — Community
    query: esports ("community manager" OR "community lead") remote
    enabled: true
  - name: Guild & Ambassador programs
    query: ("guild lead" OR "ambassador program manager" OR "guild manager") (web3 OR gaming)
    enabled: true
  - name: Marketing Comms — Gaming/Web3
    query: '"marketing communications manager" (gaming OR web3 OR crypto) remote'
    enabled: true
  - name: Localization — Program/Project
    query: ("localization manager" OR "localization project manager") remote (EMEA OR Europe)
    enabled: true
  - name: France — Community Manager
    query: '"community manager" (France OR Nice OR "Sophia Antipolis" OR remote) web3 OR gaming'
    enabled: true
  - name: Creator / Influencer Relations
    query: >-
      ("creator relations" OR "influencer relations" OR "KOL manager") (web3 OR gaming OR crypto)
      remote
    enabled: true
  - name: Executive / Founder Comms
    query: >-
      ("executive communications" OR "founder communications" OR ghostwriter) (web3 OR crypto OR
      tech) remote
    enabled: false
  - name: Email / Lifecycle Marketing
    query: ("email marketing manager" OR "lifecycle marketing" OR "CRM manager") (gaming OR web3) remote
    enabled: false
  - name: Translation — EN/ES/FR
    query: >-
      (translator OR proofreader OR "localization specialist") (Spanish OR French) remote (gaming OR
      tech)
    enabled: true
  - name: GamesJobsIndex — Community/Social
    query: >-
      site:gamesjobsindex.com ("community manager" OR "social media manager" OR "content manager" OR
      "marketing communications") remote
    enabled: true
  - name: LinkedIn — Community (Remote EU)
    query: >-
      site:linkedin.com/jobs ("community manager" OR "head of community" OR "social media manager")
      (remote OR Europe OR EMEA)
    enabled: true
  - name: HelloWork — Community/Social (FR)
    query: site:hellowork.com ("community manager" OR "social media manager")
    enabled: true
  - name: WelcomeToTheJungle — Community
    query: site:welcometothejungle.com ("community manager" OR "social media manager") (remote OR télétravail)
    enabled: true
  - name: Community Lead & Director — senior
    query: >-
      ("Community Lead" OR "Director of Community" OR "Head of Community") (remote OR Europe OR
      EMEA) -intern -junior
    enabled: true

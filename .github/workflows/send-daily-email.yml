name: Send Daily Scan Email

# Runs the zero-token portal scan on GitHub's runners (where api.resend.com is
# reachable) and emails the digest. The Claude Code remote environment blocks
# outbound mail (Resend + SMTP), so this workflow is the delivery path.
#
# Requires repo Actions secrets:
#   RESEND_API_KEY — Resend HTTP API key
#   PORTALS_YML    — contents of portals.yml (gitignored locally; comment-stripped copy)

on:
  schedule:
    # 09:47 UTC = 11:47 CEST (España). NOTE: scheduled runs only fire from the
    # default branch — merge this workflow to main for the schedule to activate.
    - cron: '47 9 * * *'
  # Editing this workflow on the feature branch fires a run — the only way to
  # trigger it from an environment where the Actions API is unreachable.
  push:
    branches: [claude/view-page-display-ggrYS]
    paths: ['.github/workflows/send-daily-email.yml']
  workflow_dispatch:
    inputs:
      scan_date:
        description: 'Scan date (YYYY-MM-DD, empty = today)'
        required: false
        default: ''
      notify_email:
        description: 'Recipient email'
        required: false
        # Must be the Resend account owner's address while the shared sender
        # onboarding@resend.dev is in use — Resend accepts (HTTP 200) but does
        # NOT deliver to any other recipient. Verify a domain in Resend to lift
        # this restriction and send anywhere.
        default: 'traducto@gmail.com'
      skip_scan:
        description: 'Skip the scan, just email existing data'
        required: false
        default: 'false'

jobs:
  scan-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore portals.yml from secret
        if: ${{ inputs.skip_scan != 'true' }}
        env:
          PORTALS_YML: ${{ secrets.PORTALS_YML }}
        run: |
          if [ -z "$PORTALS_YML" ]; then
            echo "::warning::PORTALS_YML secret not set — skipping scan, will email existing data only."
            echo "SKIP_SCAN=1" >> "$GITHUB_ENV"
          else
            printf '%s\n' "$PORTALS_YML" > portals.yml
            echo "portals.yml restored ($(wc -c < portals.yml) bytes)"
          fi

      - name: Install dependencies
        if: ${{ inputs.skip_scan != 'true' && env.SKIP_SCAN != '1' }}
        run: npm ci

      - name: Run portal scan
        if: ${{ inputs.skip_scan != 'true' && env.SKIP_SCAN != '1' }}
        run: node scan.mjs || echo "::warning::scan exited nonzero — emailing whatever was recorded"

      - name: Commit scan results back
        if: ${{ inputs.skip_scan != 'true' && env.SKIP_SCAN != '1' }}
        run: |
          git config user.name "career-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan-history.tsv data/pipeline.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily scan results $(date -u +%F)"
            git push
          fi

      - name: Send scan digest email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCAN_DATE: ${{ inputs.scan_date }}
          NOTIFY_EMAIL: ${{ inputs.notify_email }}
        run: |
          node - <<'EOF'
          import { readFileSync } from 'fs';

          const RESEND_API_KEY = process.env.RESEND_API_KEY;
          const FROM = 'career-ops <onboarding@resend.dev>';
          const TO = process.env.NOTIFY_EMAIL || 'traducto@gmail.com';
          const today = process.env.SCAN_DATE || new Date().toISOString().slice(0, 10);

          // The dev environment cannot read Actions logs (the egress proxy blocks
          // the API, and the UI needs a session), so every outcome is also written
          // to email-status.txt and committed back — that file is the diagnosis.
          const { writeFileSync } = await import('fs');
          const report = (line) => {
            console.log(line);
            writeFileSync('email-status.txt', `${new Date().toISOString()}  ${line}\n`);
          };

          if (!RESEND_API_KEY) {
            report('FAIL — RESEND_API_KEY secret is not set on the repository.');
            process.exit(0);
          }

          const tsv = readFileSync('data/scan-history.tsv', 'utf-8');
          const rows = tsv.trim().split('\n').slice(1)
            .filter(l => l.trim())
            .map(l => {
              const [url, first_seen, portal, title, company, status] = l.split('\t');
              return { url, first_seen, portal, title, company, status };
            })
            .filter(r => r.first_seen === today && r.status === 'added');

          const groups = { api: [], t1: [], t2: [], t3: [], seriesA: [], general: [] };
          for (const r of rows) {
            const p = (r.portal || '').toLowerCase();
            if (p.startsWith('[api:')) groups.api.push(r);
            else if (p.startsWith('[t1:')) groups.t1.push(r);
            else if (p.startsWith('[t2:')) groups.t2.push(r);
            else if (p.startsWith('[t3:')) groups.t3.push(r);
            else if (p.startsWith('[seriesa:')) groups.seriesA.push(r);
            else groups.general.push(r);
          }

          const total = rows.length;
          const apiCount = groups.api.length;
          const webCount = total - apiCount;

          function tableFor(title, items) {
            if (!items.length) return '';
            const trs = items.map(r =>
              `<tr><td style="padding:6px 8px;border-bottom:1px solid #eee"><a href="${r.url}" style="color:#4f46e5;text-decoration:none">${r.title || '(no title)'}</a></td><td style="padding:6px 8px;border-bottom:1px solid #eee;white-space:nowrap">${r.company || ''}</td><td style="padding:6px 8px;border-bottom:1px solid #eee;font-size:11px;color:#888">${r.portal || ''}</td></tr>`
            ).join('');
            return `<h3 style="margin:24px 0 8px;color:#374151;font-size:14px;text-transform:uppercase;letter-spacing:.05em">${title} (${items.length})</h3><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:4px 8px;background:#f9fafb;border-bottom:2px solid #e5e7eb">Title</th><th style="text-align:left;padding:4px 8px;background:#f9fafb;border-bottom:2px solid #e5e7eb">Company</th><th style="text-align:left;padding:4px 8px;background:#f9fafb;border-bottom:2px solid #e5e7eb">Source</th></tr></thead><tbody>${trs}</tbody></table>`;
          }

          let subject, html;
          if (total === 0) {
            subject = `career-ops: no new roles today — ${today}`;
            html = `<div style="font-family:sans-serif;max-width:600px;margin:0 auto;padding:24px"><h2 style="color:#111">career-ops daily scan — ${today}</h2><p style="color:#6b7280">No new roles matched today.</p><blockquote style="border-left:3px solid #e5e7eb;margin:24px 0;padding:8px 16px;color:#9ca3af;font-style:italic">"We are the knights who say 'Ni!' — and today, no jobs matched."</blockquote></div>`;
          } else {
            subject = `career-ops: ${total} new role(s) (${apiCount} API + ${webCount} WebSearch) — ${today}`;
            html = `<div style="font-family:sans-serif;max-width:720px;margin:0 auto;padding:24px"><h2 style="color:#111;margin-bottom:4px">career-ops daily scan — ${today}</h2><p style="color:#6b7280;margin-top:0"><strong>${total} new role(s)</strong> — ${apiCount} via direct ATS · ${webCount} via WebSearch</p>${tableFor('Direct ATS', groups.api)}${tableFor('Tier 1 — VC Portfolio', groups.t1)}${tableFor('Series A Targets', groups.seriesA)}${tableFor('Tier 2 — Web3-native', groups.t2)}${tableFor('Tier 3 — Niche / Curated', groups.t3)}${tableFor('General WebSearch', groups.general)}<hr style="margin:32px 0;border:none;border-top:1px solid #e5e7eb"><p style="color:#9ca3af;font-size:12px">All roles added to <code>data/pipeline.md</code>. Run <code>/career-ops pipeline</code> to evaluate.</p></div>`;
          }

          const res = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${RESEND_API_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: FROM, to: [TO], subject, html })
          });
          const body = await res.json();
          if (!res.ok) {
            report(`FAIL — Resend HTTP ${res.status}: ${JSON.stringify(body)}`);
            process.exit(0);
          }
          report(`OK — sent to ${TO} (id=${body.id}) subject: "${subject}"`);
          EOF

      - name: Publish the outcome so it is readable over git
        if: always()
        run: |
          test -f email-status.txt || echo "$(date -u +%FT%TZ)  FAIL — the email step died before reporting." > email-status.txt
          cat email-status.txt
          git config user.name "career-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f email-status.txt
          git diff --cached --quiet || git commit -m "chore: email delivery status [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

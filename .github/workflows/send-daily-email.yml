name: Send Daily Scan Email

on:
  workflow_dispatch:
    inputs:
      scan_date:
        description: 'Scan date (YYYY-MM-DD)'
        required: true
        default: ''
      notify_email:
        description: 'Recipient email'
        required: false
        default: 'guildmaster.core@gmail.com'

jobs:
  send-email:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send scan digest email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCAN_DATE: ${{ inputs.scan_date }}
          NOTIFY_EMAIL: ${{ inputs.notify_email }}
        run: |
          node - <<'EOF'
          import { readFileSync } from 'fs';

          const RESEND_API_KEY = process.env.RESEND_API_KEY;
          const FROM = 'career-ops <onboarding@resend.dev>';
          const TO = process.env.NOTIFY_EMAIL || 'guildmaster.core@gmail.com';
          const today = process.env.SCAN_DATE || new Date().toISOString().slice(0, 10);

          if (!RESEND_API_KEY) {
            console.error('RESEND_API_KEY secret not set. Add it in repo Settings → Secrets → Actions.');
            process.exit(1);
          }

          const tsv = readFileSync('data/scan-history.tsv', 'utf-8');
          const rows = tsv.trim().split('\n').slice(1)
            .filter(l => l.trim())
            .map(l => {
              const [url, first_seen, portal, title, company, status] = l.split('\t');
              return { url, first_seen, portal, title, company, status };
            })
            .filter(r => r.first_seen === today && r.status === 'added');

          const groups = { api: [], t1: [], t2: [], t3: [], seriesA: [], general: [] };
          for (const r of rows) {
            const p = (r.portal || '').toLowerCase();
            if (p.startsWith('[api:')) groups.api.push(r);
            else if (p.startsWith('[t1:')) groups.t1.push(r);
            else if (p.startsWith('[t2:')) groups.t2.push(r);
            else if (p.startsWith('[t3:')) groups.t3.push(r);
            else if (p.startsWith('[seriesa:')) groups.seriesA.push(r);
            else groups.general.push(r);
          }

          const total = rows.length;
          const apiCount = groups.api.length;
          const webCount = total - apiCount;

          function tableFor(title, items) {
            if (!items.length) return '';
            const trs = items.map(r =>
              `<tr><td style="padding:6px 8px;border-bottom:1px solid #eee"><a href="${r.url}" style="color:#4f46e5;text-decoration:none">${r.title || '(no title)'}</a></td><td style="padding:6px 8px;border-bottom:1px solid #eee;white-space:nowrap">${r.company || ''}</td><td style="padding:6px 8px;border-bottom:1px solid #eee;font-size:11px;color:#888">${r.portal || ''}</td></tr>`
            ).join('');
            return `<h3 style="margin:24px 0 8px;color:#374151;font-size:14px;text-transform:uppercase;letter-spacing:.05em">${title} (${items.length})</h3><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:4px 8px;background:#f9fafb;border-bottom:2px solid #e5e7eb">Title</th><th style="text-align:left;padding:4px 8px;background:#f9fafb;border-bottom:2px solid #e5e7eb">Company</th><th style="text-align:left;padding:4px 8px;background:#f9fafb;border-bottom:2px solid #e5e7eb">Source</th></tr></thead><tbody>${trs}</tbody></table>`;
          }

          let subject, html;
          if (total === 0) {
            subject = `career-ops: no new roles today — ${today}`;
            html = `<div style="font-family:sans-serif;max-width:600px;margin:0 auto;padding:24px"><h2 style="color:#111">career-ops daily scan — ${today}</h2><p style="color:#6b7280">No new roles matched today.</p><blockquote style="border-left:3px solid #e5e7eb;margin:24px 0;padding:8px 16px;color:#9ca3af;font-style:italic">"We are the knights who say 'Ni!' — and today, no jobs matched."</blockquote></div>`;
          } else {
            subject = `career-ops: ${total} new role(s) (${apiCount} API + ${webCount} WebSearch) — ${today}`;
            html = `<div style="font-family:sans-serif;max-width:720px;margin:0 auto;padding:24px"><h2 style="color:#111;margin-bottom:4px">career-ops daily scan — ${today}</h2><p style="color:#6b7280;margin-top:0"><strong>${total} new role(s)</strong> — ${apiCount} via direct ATS · ${webCount} via WebSearch</p>${tableFor('Direct ATS', groups.api)}${tableFor('Tier 1 — VC Portfolio', groups.t1)}${tableFor('Series A Targets', groups.seriesA)}${tableFor('Tier 2 — Web3-native', groups.t2)}${tableFor('Tier 3 — Niche / Curated', groups.t3)}${tableFor('General WebSearch', groups.general)}<hr style="margin:32px 0;border:none;border-top:1px solid #e5e7eb"><p style="color:#9ca3af;font-size:12px">All roles added to <code>data/pipeline.md</code>. Run <code>/career-ops pipeline</code> to evaluate.</p></div>`;
          }

          const res = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${RESEND_API_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: FROM, to: [TO], subject, html })
          });
          const body = await res.json();
          if (!res.ok) { console.error('Resend error:', JSON.stringify(body)); process.exit(1); }
          console.log(`Email sent (id=${body.id}): "${subject}"`);
          EOF
